name: ci

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Procura segredos versionados
        run: |
          if git grep -nE "GOCSPX-|client_secret *= *['\"][^'\"]+" -- . ':!*.md' ':!.github/workflows/ci.yml'; then
            echo "::error::Possivel segredo no repositorio"; exit 1
          fi

      - name: Aplica as migracoes D1 em um SQLite local
        run: |
          for f in migrations/*.sql; do sqlite3 teste.db < "$f" ; done
          sqlite3 teste.db ".tables"

      - name: Valida HTML
        run: npx --yes htmlhint --ignore "public/pages/**" "**/*.html"
